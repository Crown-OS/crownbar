[package]
name = "crownbar"
version = "0.1.0"
edition = "2024"

[dependencies]
crownshell = { git = "https://github.com/crown-os/crownshell" }
crownos-config = { git = "https://github.com/crown-os/crownos-config" }
crownos-ipc = { git = "https://github.com/crown-os/crownos-ipc" }
crownuikit = { git = "https://github.com/crown-os/crownuikit" }
config = { path = "./config" }

anyhow = "1.0.102"
battery = "0.7.8"
chrono = "0.4.45"
tracing = "0.1.44"
log = "0.4"
env_logger = "0.11"

thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

vello = "0.9.0"
bluer = { version = "0.17.4", features = ["bluetoothd", "full", "id", "rfcomm"] }
pipewire-native = "0.1.4"
pipewire-native-spa = "0.1.4"
nmrs = "3.5"
ddc-hi = { version = "0.4", default-features = false, features = ["ddc-i2c"] }

[dev-dependencies]
# Only the offline panel preview needs to block on wgpu's async setup.
pollster = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch."https://github.com/crown-os/crownshell"]
crownshell = { path = "../crownshell" }

[patch."https://github.com/crown-os/crownos-config"]
crownos-config = { path = "../crownos-config" }

[patch."https://github.com/crown-os/crownos-ipc"]
crownos-ipc = { path = "../crownos-ipc" }

[patch."https://github.com/crown-os/crownuikit"]
crownuikit = { path = "../crownuikit" }
