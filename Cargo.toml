[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
crownbar-config = { path = "crates/config" }
crownbar-integrations = { path = "crates/integrations" }
crownbar-ui = { path = "crates/ui" }
crownbar-widgets = { path = "crates/widgets" }

crownui = { git = "https://github.com/crown-os/crownui", default-features = false, features = ["wayland", "impeller", "static", "tokio"] }
crownconfig = { git = "https://github.com/crown-os/crownui" }
crowntest = { git = "https://github.com/crown-os/crownui" }
impeller = { git = "https://github.com/crown-os/crownui", features = ["static"] }
runtime = { git = "https://github.com/crown-os/crownui" }
semantics = { git = "https://github.com/crown-os/crownui" }
taffy-layout = { git = "https://github.com/crown-os/crownui" }
view = { git = "https://github.com/crown-os/crownui" }
crownos-config = { git = "https://github.com/crown-os/crownos-config", default-features = false }
crownos-ipc = { git = "https://github.com/crown-os/crownos-ipc" }
crownotify = { git = "https://github.com/crown-os/crownotify", default-features = false }
crownplugin-proto = { git = "https://github.com/crown-os/crownos-plugins" }
crownplugin-render = { git = "https://github.com/crown-os/crownos-plugins" }

anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

# Local checkouts of the CrownOS repositories, cloned flat beside this one,
# stand in for their GitHub sources.
[patch."https://github.com/crown-os/crownui"]
crownui = { path = "../crownui/crownui" }
crownconfig = { path = "../crownui/crownconfig" }
crowntest = { path = "../crownui/crowntest" }
impeller = { path = "../crownui/impeller" }
runtime = { path = "../crownui/runtime" }
semantics = { path = "../crownui/semantics" }
taffy-layout = { path = "../crownui/taffy-layout" }
view = { path = "../crownui/view" }

[patch."https://github.com/crown-os/crownos-plugins"]
crownplugin-proto = { path = "../crownos-plugins/proto" }
crownplugin-render = { path = "../crownos-plugins/render" }

[patch."https://github.com/crown-os/crownos-config"]
crownos-config = { path = "../crownos-config" }

[patch."https://github.com/crown-os/crownos-ipc"]
crownos-ipc = { path = "../crownos-ipc" }

[patch."https://github.com/crown-os/crownotify"]
crownotify = { path = "../crownotify" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# `cargo flamegraph --profile profiling`: release codegen with symbols kept.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
